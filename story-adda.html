<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Food Adda | Curated Adda Stories & Jokes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        /* CURATED STYLES for this interactive page */
        .story-container { display: flex; flex-direction: column; align-items: center; gap: 40px; margin-top: 40px; }
        
        /* Grid of selected food item 'posters' */
        .poster-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; width: 100%; max-width: 900px; }
        .item-poster { background: var(--bg-card); padding: 15px; border-radius: 12px; border: 1px solid #333; text-align: center; cursor: pointer; transition: 0.3s; }
        .item-poster:hover, .item-poster.active { border-color: var(--primary-color); transform: scale(1.03); }
        .item-poster h3 { font-size: 0.9rem; color: var(--text-primary); margin-top: 10px; }
        
        /* The main display area that changes */
        .display-adda { background: #111; padding: 50px; border-radius: 20px; width: 100%; max-width: 900px; text-align: center; border: 2px dashed #333; }
        
        /* Stylized CSS Illustration - The circular 'plate' representation */
        .food-plate { 
            width: 130px; height: 130px; border-radius: 50%; background: #222; border: 6px solid var(--primary-color); 
            margin: 0 auto 30px auto; position: relative; overflow: hidden; 
        }
        .food-plate .food-type-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 4rem; }
        
        .food-name-story { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--primary-color); margin-bottom: 20px; text-transform: uppercase; }
        .adda-text { color: var(--text-secondary); max-width: 600px; margin: 0 auto; line-height: 1.8; margin-bottom: 25px; min-height: 100px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo-area">
            <img src="logo.png" alt="TFA Logo" class="logo-img">
            <a href="index.html" class="logo-text">The Food Adda</a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="story-adda.html" class="active">Adda Stories</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <a href="menu.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
    </nav>

    <div class="container story-container">
        <h2 style="color:var(--primary-color);">Discover Curated Adda Stories</h2>
        <p style="text-align:center; max-width:600px; color:var(--text-secondary);">Click on a student's favorite selection to uncover its unique "Adda Story" and some fun college jokes.</p>
        
        <div class="poster-grid" id="story-selectors"></div>

        <div class="display-adda" id="adda-display"></div>
    </div>

    <footer>
        <p>&copy; 2026 The Food Adda | Website By Aman Yadav K</p>
        <div class="social-icons"> IG </div>
    </footer>

    <script>
        // Story and Icon Data
        const addaData = [
            { 
                id: 1, name: "Oreo Shake", icon: "🥛",
                joke: "What did the two Oreos say to each other before the shake? 'Don't fall in!'",
                story: "Legend has it this shake is so good, it can convert a serious study session into a party instantly. Perfect for post-exam chill-outs. Students rumor that a certain 'Local Guide Ananya' credits this shake with her GPA score."
            },
            { 
                id: 2, name: "Plain Maggi", icon: "🍜",
                joke: "Why do college students always lose at games? Because we never have any money, but we always have Plain Maggi and we always stick together!",
                story: "The ultimate college comfort food. Maggi at TFA isn't just an item, it's a student support system. If you're missing home or stressed about finals, a steaming bowl of Plain Maggi solves everything."
            },
            { 
                id: 3, name: "Grilled Sandwich", icon: "🍞",
                joke: "Why did the two slices of bread cross the road? Because they were part of a Grilled Sandwich coding marathon!",
                story: "Our signature sandwich, rumored to be invented by a student during a late-night coding marathon. When you need premium fuel for a creative mind, Grilled Sandwich is the conceptual fuel choice."
            },
            { 
                id: 4, name: "Momo (Veg)", icon: "🥟",
                joke: "Why don't Momos ever make bad decisions? Because they are steamed, Kurkured, and always think 'Tandoori' things through!",
                story: "From Hitanshu Varu's trusted 'Fried Momos are okay' rating, we have developed a dedicated student cult following. TFA Momos are the conceptual college snack, perfect for building friendships near the student hangout area."
            }
        ];

        // 1. Initialize selectors
        const selectors = document.getElementById('story-selectors');
        addaData.forEach(item => {
            selectors.innerHTML += `
                <div class="item-poster" id="poster-${item.id}" onclick="showAdda(${item.id})">
                    <div class="food-plate" style="width:70px; height:70px; margin-bottom:10px; border-width:3px;"><span class="food-type-icon" style="font-size:2.5rem;">${item.icon}</span></div>
                    <h3>${item.name} Adda Choice</h3>
                </div>
            `;
        });

        // 2. Interaction function
        function showAdda(id) {
            // Find active, remove, add to current
            document.querySelectorAll('.item-poster').forEach(p => p.classList.remove('active'));
            document.getElementById(`poster-${id}`).classList.add('active');

            // Find data
            const item = addaData.find(i => i.id === id);
            
            // Update display
            const display = document.getElementById('adda-display');
            display.innerHTML = `
                <div class="food-plate"><span class="food-type-icon">${item.icon}</span></div>
                <div class="food-name-story">Conceptual TFA Story for: ${item.name}</div>
                <div class="adda-text">
                    <p style="color:var(--primary-color); font-weight:600;">STUDENT JOKE:</p>
                    <p style="margin-bottom: 20px;">“${item.joke}”</p>
                    <p style="color:var(--primary-color); font-weight:600;">THE ADDA STORY:</p>
                    <p>${item.story}</p>
                </div>
                <button class="btn" style="background:var(--text-secondary); color:#111;" onclick="alert('Student Selection Confirmed')">Share Your Own Adda Story!</button>
            `;
        }

        // Show first story by default
        showAdda(addaData[0].id);
    </script>
</body>
</html>
